    <script>
        let databaseSetupComplete = false;

        const api = {
            async getCertificates() {
                const r = await fetch('/api/certificates');
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async saveCertificate(cert) {
                const r = await fetch('/api/certificates', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cert)
                });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async updateCertificate(id, cert) {
                const r = await fetch(`/api/certificates/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(cert)
                });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async deleteCertificate(id) {
                const r = await fetch(`/api/certificates/${id}`, { method: 'DELETE' });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async getDropdownItems() {
                const r = await fetch('/api/dropdown-items');
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async addDropdownItem(type, name, logo) {
                const r = await fetch('/api/dropdown-items', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type, name, logo: logo || '' })
                });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async updateDropdownItem(id, name, logo) {
                const r = await fetch(`/api/dropdown-items/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, logo: logo || '' })
                });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async deleteDropdownItem(id) {
                const r = await fetch(`/api/dropdown-items/${id}`, { method: 'DELETE' });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            },
            async seedDropdownItems(items) {
                const r = await fetch('/api/dropdown-items/seed', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(items)
                });
                if (!r.ok) throw new Error(await r.text());
                return r.json();
            }
        };

        // =================== CACHING SYSTEM ===================
        const CACHE_PREFIX = 'cert_cache_';
        const CACHE_DURATION = 30 * 60 * 1000; // 30 minutes

        function getCacheKey(certNumber) {
            return CACHE_PREFIX + certNumber;
        }

        function getFromCache(certNumber) {
            try {
                const cacheKey = getCacheKey(certNumber);
                const cached = localStorage.getItem(cacheKey);
                if (!cached) return null;

                const data = JSON.parse(cached);
                const now = Date.now();

                // Check if cache is expired
                if (now - data.timestamp > CACHE_DURATION) {
                    localStorage.removeItem(cacheKey);
                    return null;
                }

                console.log('Cache hit for:', certNumber);
                return data.certificate;
            } catch (e) {
                console.error('Cache read error:', e);
                return null;
            }
        }

        function saveToCache(certNumber, certificate) {
            try {
                const cacheKey = getCacheKey(certNumber);
                const data = {
                    certificate: certificate,
                    timestamp: Date.now()
                };
                localStorage.setItem(cacheKey, JSON.stringify(data));
                console.log('Cached certificate:', certNumber);
            } catch (e) {
                console.warn('Cache save skipped:', e.message);
            }
        }

        function clearExpiredCache() {
            try {
                const now = Date.now();
                for (let i = 0; i < localStorage.length; i++) {
                    const key = localStorage.key(i);
                    if (key && key.startsWith(CACHE_PREFIX)) {
                        try {
                            const data = JSON.parse(localStorage.getItem(key));
                            if (now - data.timestamp > CACHE_DURATION * 24) { // Clear after 24 hours
                                localStorage.removeItem(key);
                            }
                        } catch (e) {
                            localStorage.removeItem(key);
                        }
                    }
                }
            } catch (e) {
                console.error('Cache cleanup error:', e);
            }
        }

        // Clean expired cache on page load
        clearExpiredCache();

        async function setupDatabase() {
            // DB is managed server-side; sync any local-only certs to the server once
            if (databaseSetupComplete) return;
            databaseSetupComplete = true;
            if (!localStorage.getItem('api_synced_v1')) {
                const localCerts = JSON.parse(localStorage.getItem('certificates') || '[]');
                if (localCerts.length > 0) {
                    console.log(`مزامنة ${localCerts.length} شهادة إلى الخادم...`);
                    let synced = 0;
                    for (const c of localCerts) {
                        if (!c.id) continue;
                        try {
                            await api.saveCertificate(c);
                            synced++;
                        } catch (e) {
                            console.warn('تخطي شهادة:', c.id, e.message);
                        }
                    }
                    console.log(`تمت مزامنة ${synced}/${localCerts.length} شهادة`);
                }
                localStorage.setItem('api_synced_v1', Date.now());
            }
        }
    </script>

            <div class="card-header">

    <script>
        const certForm = document.getElementById('certForm');
        const certList = document.getElementById('certList');

        if (certList) {
            certList.addEventListener('click', function(e) {
                const btn = e.target.closest('button[data-action]');
                if (!btn) return;
                const action = btn.getAttribute('data-action');
                const id = btn.getAttribute('data-id');
                if (action === 'edit' && typeof window.editCert === 'function') {
                    window.editCert(id);
                } else if (action === 'delete' && typeof window.deleteCert === 'function') {
                    window.deleteCert(id);
                }
            });
        }

        let dropdownData = {
            amanah: [],
            municipality: [],
            job: [],
            program: [],
            nationality: []
        };

        async function loadDropdownData() {
            // First load from LocalStorage or defaults for immediate display
            const saved = localStorage.getItem('dropdownData');
            if (saved) {
                dropdownData = JSON.parse(saved);
                // Ensure nationality exists for older versions
                if (!dropdownData.nationality) dropdownData.nationality = [];
            } else {
                dropdownData = {
                    amanah: [
                        { name: 'أمانة منطقة حائل', logo: '' },
                        { name: 'أمانة منطقة الرياض', logo: '' },
                        { name: 'أمانة منطقة مكة المكرمة', logo: '' },
                        { name: 'أمانة منطقة المدينة المنورة', logo: '' },
                        { name: 'أمانة منطقة الشرقية', logo: '' }
                    ],
                    municipality: [
                        { name: 'بلدية انبوان' },
                        { name: 'بلدية وسط حائل' },
                        { name: 'بلدية شمال حائل' },
                        { name: 'بلدية جنوب حائل' }
                    ],
                    job: [
                        { name: 'عامل مطبخ' },
                        { name: 'طباخ' },
                        { name: 'عامل تقديم' },
                        { name: 'مدير مطعم' },
                        { name: 'صاحب منشأة غذائية' },
                        { name: 'مشرف غذائي' }
                    ],
                    program: [
                        { name: 'منشآت الغذاء' },
                        { name: 'التعامل مع الغذاء' },
                        { name: 'السلامة الغذائية' },
                        { name: 'النظافة الشخصية' }
                    ],
                    nationality: [
                        { name: 'سعودي' },
                        { name: 'مصر' },
                        { name: 'باكستان' },
                        { name: 'الهند' },
                        { name: 'بنغلاديش' },
                        { name: 'اليمن' }
                    ]
                };
                saveDropdownData();
            }
            
            // Render immediately
            renderManagementLists();
            refreshDropdowns();

            // Then try to load from server API in background
            (async () => {
                try {
                    const results = await api.getDropdownItems();
                    if (results && results.length > 0) {
                        const newDropdownData = { amanah: [], municipality: [], job: [], program: [], nationality: [] };
                        results.forEach(item => {
                            if (newDropdownData[item.type]) {
                                newDropdownData[item.type].push({
                                    id: item.id,
                                    name: item.name,
                                    logo: item.logo || ''
                                });
                            }
                        });
                        dropdownData = newDropdownData;
                        saveDropdownData();
                        renderManagementLists();
                        refreshDropdowns();
                        console.log('Dropdown data loaded from server');
                    } else {
                        // Seed database if empty
                        try {
                            const seedItems = [];
                            for (const type in dropdownData) {
                                for (const item of dropdownData[type]) {
                                    seedItems.push({ type, name: item.name, logo: item.logo || '' });
                                }
                            }
                            await api.seedDropdownItems(seedItems);
                            console.log('Dropdown data seeded to server');
                        } catch (e) {
                            console.error('Failed to seed dropdown items:', e);
                        }
                    }
                } catch (e) {
                    console.error('Failed to load dropdown items from server:', e);
                }
            })();
        }

        function saveDropdownData() {

        async function addItem(type) {
            const input = document.getElementById('new' + type.charAt(0).toUpperCase() + type.slice(1));
            const logoInput = document.getElementById('new' + type.charAt(0).toUpperCase() + type.slice(1) + 'Logo');
            let newItem = { name: input.value.trim(), logo: '' };

            if (!newItem.name) {
                openAlertModal('تنبيه', 'الرجاء إدخال اسم');
                return;
            }

            const processAddition = async (item) => {
                try {
                    const result = await api.addDropdownItem(type, item.name, item.logo || '');
                    item.id = result.id;
                } catch (e) {
                    console.error('Failed to save item to server:', e);
                }
                dropdownData[type].push(item);
                saveDropdownData();
                renderManagementLists();
                refreshDropdowns();
                input.value = '';
                if (logoInput) logoInput.value = '';
            };

            if ((type === 'municipality' || type === 'amanah') && logoInput && logoInput.files[0]) {
                const reader = new FileReader();
                reader.onload = async function(e) {
                    newItem.logo = e.target.result;
                    await processAddition(newItem);
                };
                reader.readAsDataURL(logoInput.files[0]);
            } else {
                await processAddition(newItem);
            }
        }

        function generateCertNumber() {
            const prefix = '470';
            let suffix = '';
            for (let i = 0; i < 9; i++) {
                suffix += Math.floor(Math.random() * 10).toString();
            }
            return prefix + suffix;
        }

        function toHijriDate(gregorianDate) {
            const date = new Date(gregorianDate);
            const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', { year: 'numeric', month: '2-digit', day: '2-digit' }).format(date);
            return hijri.replace('[\u0660-\u0669]', function(m) { return m.charCodeAt(0); });
        }

        function addOneYear(gregorianDate) {
            const date = new Date(gregorianDate);
            date.setFullYear(date.getFullYear() + 1);
            return date;
        }

        function addThreeYears(gregorianDate) {
            const date = new Date(gregorianDate);
            date.setFullYear(date.getFullYear() + 3);
            return date;
        }

                    document.getElementById('imgPreview').style.display = 'block';
                    document.getElementById('fileLabel').style.display = 'none';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

            const expiry = addOneYear(today);

            document.getElementById('cert_expiryDateHijri').value = toHijriDate(expiryStr);

        function downloadJSON(data, filename) {
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function upsertCertificateCache(cert) {
            // Update in-memory cache only (avoid localStorage overflow from large base64 images)
            if (!window._cachedCertificates) window._cachedCertificates = [];
            const idx = window._cachedCertificates.findIndex(c => (c.id || '') === (cert.id || ''));
            if (idx >= 0) {
                window._cachedCertificates[idx] = cert;
            } else {
                window._cachedCertificates.push(cert);
            }

            // Save a lightweight version (no profile image) to localStorage per-cert cache
            const slim = Object.assign({}, cert, { profileImage: '' });
            try {
                if (cert.certNumber) saveToCache(cert.certNumber, slim);
                if (cert.id) saveToCache(cert.id, slim);
                if (cert.idNumber) saveToCache(cert.idNumber, slim);
            } catch (e) {
                console.warn('Cache save skipped:', e.message);
            }
        }

        function removeCertificateCache(id) {
            if (!window._cachedCertificates) window._cachedCertificates = [];
            const certToDelete = window._cachedCertificates.find(c => (c.id || '') === id);
            window._cachedCertificates = window._cachedCertificates.filter(c => (c.id || '') !== id);

            if (certToDelete) {
                if (certToDelete.certNumber) localStorage.removeItem(getCacheKey(certToDelete.certNumber));
                if (certToDelete.id) localStorage.removeItem(getCacheKey(certToDelete.id));
                if (certToDelete.idNumber) localStorage.removeItem(getCacheKey(certToDelete.idNumber));
            }
        }

            if (!profileImg || profileImg.includes('user-default.png')) return 'https://apps.balady.gov.sa/BALADYCDN/Content/images/user-default.png';
            if (!profileImg.startsWith('data:')) return profileImg;
            
            if (window.firebaseDisabled || !window.storage) {
                console.log('Firebase disabled or storage not ready, using data URL for profile image.');
                return profileImg;
            }
            
            try {
                const ref = window.storage.ref('profileImages/' + certId);
                await ref.putString(profileImg, 'data_url');
                return await ref.getDownloadURL();
            } catch (err) {
                console.error('Image upload failed, falling back to data URL:', err);
                return profileImg;
            }
        }

        function uploadJSONFile(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const certificates = JSON.parse(e.target.result);
                    if (Array.isArray(certificates)) {
                        localStorage.setItem('certificates', JSON.stringify(certificates));
                        certificates.forEach(cert => {
                            if (cert.certNumber) saveToCache(cert.certNumber, cert);
                            if (cert.id) saveToCache(cert.id, cert);
                            if (cert.idNumber) saveToCache(cert.idNumber, cert);
                        });
                        displayCertificates();
                        openAlertModal('تم بنجاح', 'تم تحميل البيانات من ملف JSON بنجاح!');
                    } else {
                        openAlertModal('خطأ', 'الملف يجب أن يحتوي على مصفوفة من الشهادات.');
                    }
                } catch (err) {
                    console.error('Error parsing JSON:', err);
                    openAlertModal('خطأ', 'فشل تحليل ملف JSON.');
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }

            document.getElementById('cert_certNumber').value = generateCertNumber();
            
            // Load database in background
            setupDatabase();
            
            // Load dropdown data and certificates in parallel
            Promise.all([
                loadDropdownData().then(() => {
                    renderManagementLists();
                    refreshDropdowns();
                }),
                displayCertificates()
            ]).catch(err => console.error('Loading error:', err));
        }
        initApp();

        // تحويل الأرقام العربية والفارسية تلقائياً إلى أرقام إنجليزية في كل حقول الإدخال
        function arabicToEnglishDigits(str) {
            if (str == null) return str;
            return String(str)
                .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
                .replace(/[\u06F0-\u06F9]/g, d => String(d.charCodeAt(0) - 0x06F0));
        }

        document.addEventListener('input', function(e) {
            const t = e.target;
            if (!t || !(t instanceof HTMLInputElement || t instanceof HTMLTextAreaElement)) return;
            const type = (t.type || '').toLowerCase();
            if (['file', 'checkbox', 'radio', 'date', 'color', 'range'].includes(type)) return;
            const original = t.value;
            const converted = arabicToEnglishDigits(original);
            if (converted !== original) {
                const start = t.selectionStart;
                const end = t.selectionEnd;
                t.value = converted;
                try { t.setSelectionRange(start, end); } catch (_) {}
            }
        }, true);
    </script>

    <!-- Modal لتعديل الاسم -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h4>تعديل الاسم</h4>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="p-3">
                <input type="text" id="editItemName" class="form-control mb-3">
                <div class="text-end">
                    <button class="btn btn-secondary btn-sm" onclick="closeEditModal()">إلغاء</button>
                    <button class="btn btn-primary btn-sm" onclick="saveEditedItem()">حفظ التغييرات</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal للتأكيد -->
    <div id="confirmModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="confirmTitle">تأكيد</h4>
                <button class="modal-close" onclick="closeConfirmModal()">&times;</button>
            </div>
            <div class="p-3">
                <p id="confirmMessage"></p>
                <div class="text-end">
                    <button class="btn btn-secondary btn-sm" onclick="closeConfirmModal()">إلغاء</button>
                    <button class="btn btn-danger btn-sm" id="confirmActionBtn">تأكيد</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal للتنبيه -->
    <div id="alertModal" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h4 id="alertTitle">تنبيه</h4>
                <button class="modal-close" onclick="closeAlertModal()">&times;</button>
            </div>
            <div class="p-3">
                <p id="alertMessage"></p>
                <div class="text-end">
                    <button class="btn btn-primary btn-sm" onclick="closeAlertModal()">حسناً</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentEditInfo = null;
        let confirmCallback = null;

        function openAlertModal(title, message) {
            document.getElementById('alertTitle').textContent = title;
            document.getElementById('alertMessage').textContent = message;
            document.getElementById('alertModal').classList.add('show');
        }

        function closeAlertModal() {
            document.getElementById('alertModal').classList.remove('show');
        }

        function openConfirmModal(title, message, callback, isDanger = true) {
            document.getElementById('confirmTitle').textContent = title;
            document.getElementById('confirmMessage').textContent = message;
            confirmCallback = callback;
            
            const actionBtn = document.getElementById('confirmActionBtn');
            actionBtn.className = isDanger ? 'btn btn-danger btn-sm' : 'btn btn-success btn-sm';
            actionBtn.onclick = () => {
                if (confirmCallback) confirmCallback();
                closeConfirmModal();
            };
            
            document.getElementById('confirmModal').classList.add('show');
        }

        function closeConfirmModal() {
            document.getElementById('confirmModal').classList.remove('show');
            confirmCallback = null;
        }

        function openEditModal(type, index) {
            const item = dropdownData[type][index];
            currentEditInfo = { type, index };
            document.getElementById('editItemName').value = item.name;
            document.getElementById('editModal').classList.add('show');
        }

        function closeEditModal() {
            document.getElementById('editModal').classList.remove('show');
            currentEditInfo = null;
        }

        function saveEditedItem() {
            if (!currentEditInfo) return;
            
            const newName = document.getElementById('editItemName').value.trim();
            if (newName === '') {
                openAlertModal('تنبيه', 'الاسم لا يمكن أن يكون فارغاً');
                return;
            }

            const { type, index } = currentEditInfo;
            const item = dropdownData[type][index];
            item.name = newName;

            if (type === 'amanah' || type === 'municipality') {
                openConfirmModal('تغيير الشعار', 'هل تريد تغيير الشعار أيضاً؟', () => {
                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = 'image/*';
                    fileInput.onchange = e => {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = event => {
                                item.logo = event.target.result;
                                finalizeEdit();
                            };
                            reader.readAsDataURL(file);
                        }
                    };
                    fileInput.click();
                    closeEditModal();
                }, false); // Not a danger action
                return;
            }
            
            finalizeEdit();
        }

        async function finalizeEdit() {
            const { type, index } = currentEditInfo;
            const item = dropdownData[type][index];
            
            if (item.id) {
                try {
                    await api.updateDropdownItem(item.id, item.name, item.logo || '');
                } catch (e) {
                    console.error('Failed to update item on server:', e);
                }
            }
            
            saveDropdownData();
            renderManagementLists();
            refreshDropdowns();
            closeEditModal();
        }
    </script>
</body>
</html>
