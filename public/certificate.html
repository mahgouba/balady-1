    <script>
        const NEON_CONNECTION_STRING = "postgresql://neondb_owner:npg_4fDRaepF6NLQ@ep-little-shape-antqb07h-pooler.c-6.us-east-1.aws.neon.tech/neondb?sslmode=require";
        let sql;
        try {
            if (typeof neon !== 'undefined') {
                const _c = neon.neon(NEON_CONNECTION_STRING);
                const withTimeout = (p, ms) =>
                    Promise.race([p, new Promise((_, r) => setTimeout(() => r(new Error('timeout')), ms))]);
                sql = (strings, ...values) => withTimeout(_c(strings, ...values), 5000);
            }
        } catch (e) {
            console.error('Failed to initialize Neon:', e);
        }

    <script>
        // تحويل الأرقام العربية الهندية إلى أرقام إنجليزية
        function toWesternNums(str) {
            if (!str) return '';
            return str.toString().replace(/[٠-٩]/g, function(d) {
                return d.charCodeAt(0) - 1632;
            }).replace(/[۰-۹]/g, function(d) {
                return d.charCodeAt(0) - 1776;
            });
        }

        const params = new URLSearchParams(window.location.search);
        let id = params.get('id') || params.get('certNumber');
        
        if (id) {
            id = toWesternNums(id).trim();
            console.log("Searching for certificate:", id);
        }

        async function loadData() {
            if (!id) {
                alert('عذراً، لم يتم تحديد رقم الشهادة.');
                window.location.href = '/';
                return;
            }

            let cert = null;
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';

            // Helper function to save certificate to cache
            function saveCertToCache(certificate) {
                // Save to individual cache keys
                if (certificate.id) {
                    localStorage.setItem('cert_cache_' + certificate.id, JSON.stringify({ certificate, timestamp: Date.now() }));
                }
                if (certificate.certNumber) {
                    localStorage.setItem('cert_cache_' + certificate.certNumber, JSON.stringify({ certificate, timestamp: Date.now() }));
                }
                if (certificate.idNumber) {
                    localStorage.setItem('cert_cache_' + certificate.idNumber, JSON.stringify({ certificate, timestamp: Date.now() }));
                }
                
                // Also update the certificates array
                const certificates = JSON.parse(localStorage.getItem('certificates') || '[]');
                const idx = certificates.findIndex(c => (c.id || '') === (certificate.id || ''));
                if (idx >= 0) {
                    certificates[idx] = certificate;
                } else {
                    certificates.push(certificate);
                }
                localStorage.setItem('certificates', JSON.stringify(certificates));
            }

            // أطلق استعلام Neon فوراً بالتوازي مع البحث في LocalStorage
            const neonPromise = (typeof sql !== 'undefined') ? sql`
                SELECT id, amanah, amanah_logo, municipality, municipality_logo,
                       name, id_number, gender, nationality, cert_number, job,
                       issue_date_hijri, issue_date_gregorian, expiry_date_hijri, expiry_date_gregorian,
                       profile_image, establishment_name, establishment_number,
                       license_number, program_type, program_end_date, created_at
                FROM certificates
                WHERE id = ${id} OR cert_number = ${id}
                LIMIT 1
            `.catch(() => null) : Promise.resolve(null);

            try {
                // 1. Cache فردي في LocalStorage - فوري
                if (!cert) {
                    for (const key of ['cert_cache_' + id, 'cert_cache_' + id.replace(/[^0-9]/g, '')]) {
                        try {
                            const cached = localStorage.getItem(key);
                            if (cached) {
                                const data = JSON.parse(cached);
                                if (Date.now() - data.timestamp < 24 * 60 * 60 * 1000) {
                                    cert = data.certificate;
                                    break;
                                }
                            }
                        } catch (e) {}
                    }
                }

                // 2. مصفوفة certificates في LocalStorage - فوري
                if (!cert) {
                    const certificates = JSON.parse(localStorage.getItem('certificates') || '[]');
                    cert = certificates.find(c => String(c.id) === String(id) || String(c.certNumber) === String(id));
                }

                // 3. Neon - الاستعلام كان يعمل بالتوازي، await للنتيجة فقط
                if (!cert) {
                    const results = await neonPromise;
                    if (results && results.length > 0) {
                        const row = results[0];
                        cert = {
                            id: row.id,
                            amanah: row.amanah,
                            amanahLogo: row.amanah_logo,
                            municipality: row.municipality,
                            municipalityLogo: row.municipality_logo,
                            name: row.name,
                            idNumber: row.id_number,
                            gender: row.gender,
                            nationality: row.nationality,
                            certNumber: row.cert_number,
                            job: row.job,
                            issueDateHijri: row.issue_date_hijri,
                            issueDateGregorian: row.issue_date_gregorian,
                            expiryDateHijri: row.expiry_date_hijri,
                            expiryDateGregorian: row.expiry_date_gregorian,
                            profileImage: row.profile_image,
                            establishmentName: row.establishment_name,
                            establishmentNumber: row.establishment_number,
                            licenseNumber: row.license_number,
                            programType: row.program_type,
                            programEndDate: row.program_end_date,
                            createdAt: row.created_at
                        };
                        if (cert) saveCertToCache(cert);
                    }
                }

                // 4. Try Firebase if not found in Neon or LocalStorage
                if (!cert) {
                    try {
                        const ready = await window.firebaseReady;
                        const db = window.db || (ready && ready.db);
                        if (db) {
                            const docSnap = await db.collection('certificates').doc(id).get();
                            if (docSnap.exists) {
                                cert = docSnap.data();
                            } else {
                                const querySnap = await db.collection('certificates')
                                    .where('certNumber', '==', id)
                                    .limit(1)
                                    .get();
                                if (!querySnap.empty) {
                                    cert = querySnap.docs[0].data();
                                }
                            }
                            if (cert) {
                                console.log('Loaded from Firebase');
                                saveCertToCache(cert);
                            }
                        }
                    } catch (e) {
                        console.error('Firebase load failed:', e);
                    }
                }

                // 5. Try static JSON as final fallback
                if (!cert) {
                    try {
                        const response = await fetch('/data/certificates.json?t=' + Date.now(), { cache: 'no-store' });
                        if (response.ok) {
                            const certificates = await response.json();
                            cert = certificates.find(c => c.id === id || c.certNumber === id);
                            if (cert) {
                                console.log('Loaded from static JSON');
                                saveCertToCache(cert);
                            }
                        }
                    } catch (e) {
                        console.warn('Static JSON load failed:', e);
                    }
                }

                if (cert) {
                    document.getElementById('data-name').textContent = cert.name || '-';
                    document.getElementById('data-id').textContent = toWesternNums(cert.idNumber) || '-';
                    document.getElementById('data-nationality').textContent = cert.nationality || '-';
                    document.getElementById('data-num').textContent = toWesternNums(cert.certNumber) || '-';
                    document.getElementById('data-job').textContent = cert.job || '-';
                    const formatHijri = (s) => {
                        if (!s) return '-';
                        let v = toWesternNums(s).replace(/\s*هـ\s*/g, '').replace(/[\u200E\u200F\u202A-\u202E\u2066-\u2069\u061C]/g, '').replace(/\s+/g, '').trim();
                        const parts = v.split(/[\/\-\.]/).filter(Boolean);
                        if (parts.length === 3) {
                            let d, m, y;
                            if (parts[0].length === 4) {
                                [y, m, d] = parts;
                            } else {
                                [d, m, y] = parts;
                            }
                            d = d.padStart(2, '0');
                            m = m.padStart(2, '0');
                            return `${y}/${m}/${d}`;
                        }
                        return v || '-';
                    };
                    document.getElementById('data-issue').textContent = formatHijri(cert.issueDateHijri);
                    document.getElementById('data-expiry').textContent = formatHijri(cert.expiryDateHijri);

                    const muniLogoEl = document.getElementById('data-municipality-logo');
                    const muniLogoUrl = (cert.municipalityLogo && cert.municipalityLogo.trim()) ||
                                        (cert.amanahLogo && cert.amanahLogo.trim()) ||
                                        '';
                    if (muniLogoUrl) {
                        muniLogoEl.onload = () => { muniLogoEl.style.display = 'block'; };
                        muniLogoEl.onerror = () => { muniLogoEl.style.display = 'none'; };
                        muniLogoEl.src = muniLogoUrl;
                    } else {
                        muniLogoEl.removeAttribute('src');
                        muniLogoEl.style.display = 'none';
                    }
                    document.getElementById('data-program').textContent = cert.programType || '-';

                    // تنسيق تاريخ انتهاء البرنامج إلى هجري إن وُجد
                    if (cert.programEndDate) {
                        const d = new Date(cert.programEndDate);
                        const hijri = new Intl.DateTimeFormat('ar-SA-u-ca-islamic', {
                            year: 'numeric', month: '2-digit', day: '2-digit',
                            numberingSystem: 'latn'
                        }).format(d);
                        document.getElementById('data-program-end').textContent = formatHijri(hijri);
                    } else {
                        document.getElementById('data-program-end').textContent = '-';
                    }

                    const profileImgEl = document.getElementById('data-photo');
                    profileImgEl.onerror = () => {
                        console.error('Profile image failed to load, using default');
                        profileImgEl.src = 'https://apps.balady.gov.sa/BALADYCDN/Content/images/user-default.png';
                        profileImgEl.onerror = null; // Prevent infinite loop if default also fails
                    };
                    if (cert.profileImage) {
                        profileImgEl.src = cert.profileImage;
                    } else {
                        profileImgEl.src = 'https://apps.balady.gov.sa/BALADYCDN/Content/images/user-default.png';
                    }

                    // توليد QR Code يوجه إلى صفحة التحقق على الاستضافة الحالية
                    // نضمّن بيانات الشهادة داخل رابط QR نفسه حتى يعمل التحقق من أي جهاز بدون خادم
                    const currentDomain = window.location.origin;
                    const verifyBaseUrl = currentDomain + '/verify/health/issue/PrintedLicenses';
                    const certNum = toWesternNums(cert.certNumber || cert.id) || '';

                    const verifyUrl = `${verifyBaseUrl}?certNumber=${encodeURIComponent(certNum)}`;

                    try {
                        new QRCode(document.getElementById("qrcode"), {
                            text: verifyUrl,
                            width: 256,
                            height: 256,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.H
                        });
                    } catch (qrError) {
                        console.error('QR Code generation failed:', qrError);
                    }
                } else {
                    alert('عذراً، لم يتم العثور على بيانات الشهادة.');
                    window.location.href = '/';
                }
            } catch (error) {
                console.error('Error loading data:', error);
                alert('تعذّر تحميل بيانات الشهادة.');
            } finally {
                loading.style.display = 'none';
            }
        }

        const PAGE_WIDTH_MM = 210;
        const PAGE_HEIGHT_MM = 132.62;

        function getJsPDF() {
            if (window.jspdf && window.jspdf.jsPDF) return window.jspdf.jsPDF;
            if (window.jsPDF) return window.jsPDF;
            if (typeof jsPDF !== 'undefined') return jsPDF;
            throw new Error('jsPDF غير متوفر');
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.crossOrigin = 'anonymous';
                img.onload = () => resolve(img);
                img.onerror = () => {
                    // retry without crossOrigin (for same-origin SVGs)
                    const img2 = new Image();
                    img2.onload = () => resolve(img2);
                    img2.onerror = reject;
                    img2.src = src;
                };
                img.src = src;
            });
        }

        // SVGs with width="100%" height="100%" have no intrinsic size, which breaks
        // html2canvas. Rewrite the root <svg> to use explicit px dimensions so it
        // rasterizes deterministically at the requested page size.
        const _bgUrlCache = new Map();
        async function getRasterBackgroundUrl(url, widthPx, heightPx) {
            const key = url + '|' + widthPx + 'x' + heightPx;
            if (_bgUrlCache.has(key)) return _bgUrlCache.get(key);
            try {
                const res = await fetch(url, { credentials: 'omit' });
                const ct = res.headers.get('content-type') || '';
                if (ct.includes('svg') || url.toLowerCase().endsWith('.svg')) {
                    let text = await res.text();
                    text = text.replace(/<svg\b([^>]*)>/i, (m, attrs) => {
                        const cleaned = attrs.replace(/\s(width|height)="[^"]*"/gi, '');
                        return `<svg${cleaned} width="${widthPx}" height="${heightPx}" preserveAspectRatio="none">`;
                    });
                    const blob = new Blob([text], { type: 'image/svg+xml' });
                    const objUrl = URL.createObjectURL(blob);
                    _bgUrlCache.set(key, objUrl);
                    return objUrl;
                }
                _bgUrlCache.set(key, url);
                return url;
            } catch (_) {
                return url;
            }
        }

        async function renderPageToCanvas(pageEl) {
            // Resolve background-image URL from the live element
            const cs = window.getComputedStyle(pageEl);
            const bgMatch = (cs.backgroundImage || '').match(/url\(["']?(.+?)["']?\)/);
            const bgUrl = bgMatch ? bgMatch[1] : null;

            // Off-screen holder sized exactly to PDF page
            const holder = document.createElement('div');
            holder.style.position = 'fixed';
            holder.style.top = '0';
            holder.style.left = '-10000px';
            holder.style.width = PAGE_WIDTH_MM + 'mm';
            holder.style.height = PAGE_HEIGHT_MM + 'mm';
            holder.style.margin = '0';
            holder.style.padding = '0';
            holder.style.background = '#ffffff';
            holder.style.zIndex = '-1';
            holder.style.overflow = 'hidden';

            const clone = pageEl.cloneNode(true);
            clone.style.width = '100%';
            clone.style.height = '100%';
            clone.style.aspectRatio = 'auto';
            clone.style.margin = '0';
            clone.style.padding = '0';
            clone.style.borderTop = 'none';
            clone.style.backgroundImage = 'none';
            clone.style.position = 'relative';

            // Inline the background as an <img> so html2canvas can rasterize it reliably.
            // Use a rewritten SVG with explicit pixel dimensions to avoid intrinsic-size issues.
            let bgImg = null;
            if (bgUrl) {
                bgImg = document.createElement('img');
                bgImg.style.position = 'absolute';
                bgImg.style.inset = '0';
                bgImg.style.width = '100%';
                bgImg.style.height = '100%';
                bgImg.style.objectFit = 'fill';
                bgImg.style.zIndex = '0';
                clone.insertBefore(bgImg, clone.firstChild);
            }

            // Make sure the existing overlay sits above the inlined background
            const overlay = clone.querySelector('.overlay');
            if (overlay) {
                overlay.style.position = 'absolute';
                overlay.style.zIndex = '2';
            }

            holder.appendChild(clone);
            document.body.appendChild(holder);

            try {
                // Wait for layout so we know the holder's pixel size
                await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                const rect = holder.getBoundingClientRect();

                // Now point the inline <img> at a rewritten SVG sized to the page in pixels
                if (bgImg && bgUrl) {
                    const targetW = Math.max(1, Math.round(rect.width));
                    const targetH = Math.max(1, Math.round(rect.height));
                    const fixedUrl = await getRasterBackgroundUrl(bgUrl, targetW, targetH);
                    bgImg.src = fixedUrl;
                    await loadImage(fixedUrl).catch(() => {});
                    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
                }
                const canvas = await html2canvas(clone, {
                    scale: 3,
                    useCORS: true,
                    allowTaint: true,
                    backgroundColor: '#ffffff',
                    width: rect.width,
                    height: rect.height,
                    windowWidth: rect.width,
                    windowHeight: rect.height,
                    logging: false
                });
                return canvas;
            } finally {
                document.body.removeChild(holder);
            }
        }

        async function buildPdfBlob() {
            const element = document.getElementById('documentContent');
            const pages = element.querySelectorAll('.page');
            const JsPDFCtor = getJsPDF();
            const pdf = new JsPDFCtor({
                unit: 'mm',
                format: [PAGE_WIDTH_MM, PAGE_HEIGHT_MM],
                orientation: 'landscape',
                compress: true
            });

            for (let i = 0; i < pages.length; i++) {
                const canvas = await renderPageToCanvas(pages[i]);
                const imgData = canvas.toDataURL('image/jpeg', 0.95);
                if (i > 0) {
                    pdf.addPage([PAGE_WIDTH_MM, PAGE_HEIGHT_MM], 'landscape');
                }
                pdf.addImage(imgData, 'JPEG', 0, 0, PAGE_WIDTH_MM, PAGE_HEIGHT_MM);
            }

            return pdf.output('blob');
        }

        async function exportToPDF() {
            const loading = document.getElementById('loading');
            loading.style.display = 'flex';
            const certNo = document.getElementById('data-num').textContent;
            try {
                const blob = await buildPdfBlob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `Balady_Cert_${certNo}.pdf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            } catch (e) {
                console.error('PDF export error:', e, e && e.message, e && e.stack);
                alert('فشل تصدير الملف: ' + ((e && (e.message || e.name)) || 'خطأ غير معروف'));
            } finally {
                loading.style.display = 'none';
            }
        }

        function downloadCertificateJSON() {
            if (window._currentCertificate) {
                const filename = `certificate_${window._currentCertificate.certNumber || window._currentCertificate.id}.json`;
                const blob = new Blob([JSON.stringify(window._currentCertificate, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } else {
                alert('لم يتم تحميل بيانات الشهادة بعد.');
            }
        }

        async function shareCertificate() {
            const loading = document.getElementById('loading');
            const certNo = document.getElementById('data-num').textContent;
            const filename = `Balady_Cert_${certNo}.pdf`;
            try {
                loading.style.display = 'flex';
                const blob = await buildPdfBlob();
                const file = new File([blob], filename, { type: 'application/pdf' });

                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: 'شهادة صحية - منصة بلدي',
                        text: 'الشهادة الصحية بصيغة PDF'
                    });
                } else {
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    alert('تم تجهيز الشهادة كملف PDF لمشاركتها.');
                }
            } catch (err) {
                console.error('Error sharing:', err, err && err.message, err && err.stack);
                if (err && err.name !== 'AbortError') {
                    alert('تعذرت المشاركة: ' + ((err && (err.message || err.name)) || 'خطأ غير معروف'));
                }
            } finally {
                loading.style.display = 'none';
            }
        }

        window.onload = loadData;
    </script>
</body>
